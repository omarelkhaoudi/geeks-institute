<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Turn-Based Strategy Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Turn-Based Strategy Game</h1>
  <button id="startBtn">Start New Game</button>
  <div id="info"></div>
  <div id="grid"></div>
  
  <div id="controls">
    <button data-dir="up">Up</button>
    <button data-dir="down">Down</button>
    <button data-dir="left">Left</button>
    <button data-dir="right">Right</button>
  </div>

  <script src="client.js"></script>
</body>
</html>
