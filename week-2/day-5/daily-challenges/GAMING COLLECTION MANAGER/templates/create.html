{% extends "base.html" %}
{% block content %}

<main class="max-w-3xl mx-auto my-10 p-6 bg-white shadow-lg rounded-xl">
  <h1 class="text-2xl font-bold mb-6">Create New Game</h1>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block mb-1 font-medium">Title</label>
      <input type="text" name="title" required class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div>
      <label class="block mb-1 font-medium">Genre</label>
      <input type="text" name="genre" required class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div>
      <label class="block mb-1 font-medium">Release Year</label>
      <input type="number" name="release_year" required class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div>
      <label class="block mb-1 font-medium">Description</label>
      <textarea name="description" rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"></textarea>
    </div>
    <div>
      <label class="block mb-1 font-medium">Rating</label>
      <input type="number" step="0.1" name="rating" required class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div>
      <label class="block mb-1 font-medium">Metacritic Score</label>
      <input type="number" name="metacritic_score" required class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div>
      <label class="block mb-1 font-medium">Tags</label>
      <input type="text" name="tags" class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div>
      <label class="block mb-1 font-medium">Image URL</label>
      <input type="text" name="image_url" class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-300"/>
    </div>
    <div class="flex justify-end gap-3 mt-6">
      <a href="{{ url_for('show_games') }}" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 transition">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Create Game</button>
    </div>
  </form>
</main>

{% endblock %}
