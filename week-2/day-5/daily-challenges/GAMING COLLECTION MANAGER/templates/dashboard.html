{% extends "base.html" %}
{% block content %}
<main class="max-w-4xl mx-auto my-10 px-4">
    <h1 class="text-3xl font-bold mb-6">Dashboard</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-2">Total Games</h2>
            <p class="text-2xl font-bold">{{ total_games }}</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-2">Total Reviews</h2>
            <p class="text-2xl font-bold">{{ total_reviews }}</p>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-lg font-semibold mb-2">Average Rating</h2>
            <p class="text-2xl font-bold">{{ avg_rating }}</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-lg font-semibold mb-4">Games by Genre</h2>
        <ul class="list-disc pl-5">
            {% for g in games_by_genre %}
            <li>{{ g.genre }}: {{ g.count }}</li>
            {% endfor %}
        </ul>
    </div>
</main>
{% endblock %}
