<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Game Edit Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .floating-label {
            transition: all 0.2s ease;
        }
        .input-focused .floating-label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #3b82f6;
        }
        .rating-star {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .rating-star:hover {
            transform: scale(1.1);
        }
        .form-field {
            position: relative;
        }
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }
        .genre-option {
            transition: all 0.2s ease;
        }
        .save-button {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            transition: all 0.3s ease;
        }
        .save-button:hover {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen py-8 px-4">
    <form action="/edit/{{ game.id }}" method="post" class="max-w-lg mx-auto bg-white backdrop-blur-sm bg-opacity-95 border border-white/20 rounded-2xl shadow-xl p-8 space-y-6">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 011-1h1a2 2 0 100-4H7a1 1 0 01-1-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-gray-900 to-gray-600 bg-clip-text text-transparent">Edit Game</h1>
            <p class="text-gray-500 mt-2">Update your game information</p>
        </div>

        <!-- Title Field -->
        <div class="form-field">
            <div class="relative">
                <input 
                    type="text" 
                    name="title" 
                    value="{{ game.title }}"
                    class="form-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-0 peer bg-gray-50/50"
                    placeholder=" "
                    id="title"
                />
                <label for="title" class="absolute left-4 top-3 text-gray-500 transition-all duration-200 peer-focus:text-xs peer-focus:-top-2 peer-focus:left-3 peer-focus:bg-white peer-focus:px-2 peer-focus:text-blue-600 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:left-3 peer-[:not(:placeholder-shown)]:bg-white peer-[:not(:placeholder-shown)]:px-2">
                    Game Title
                </label>
            </div>
        </div>

        <!-- Rating Field with Stars -->
        <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-3">Rating</label>
            <div class="flex items-center space-x-1 mb-2">
                <div id="star-rating" class="flex space-x-1">
                    <!-- Stars will be populated by JavaScript -->
                </div>
                <span id="rating-value" class="ml-3 text-lg font-semibold text-gray-700">{{ game.rating }}</span>
            </div>
            <input type="hidden" name="rating" id="rating-input" value="{{ game.rating }}" />
            <input type="range" min="0" max="10" step="0.1" value="{{ game.rating }}" 
                   class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer slider"
                   id="rating-slider" />
        </div>

        <!-- Release Year -->
        <div class="form-field">
            <div class="relative">
                <input 
                    type="number" 
                    name="release_year" 
                    value="{{ game.release_year }}"
                    min="1900" 
                    max="2025"
                    class="form-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-0 peer bg-gray-50/50"
                    placeholder=" "
                    id="year"
                />
                <label for="year" class="absolute left-4 top-3 text-gray-500 transition-all duration-200 peer-focus:text-xs peer-focus:-top-2 peer-focus:left-3 peer-focus:bg-white peer-focus:px-2 peer-focus:text-blue-600 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:left-3 peer-[:not(:placeholder-shown)]:bg-white peer-[:not(:placeholder-shown)]:px-2">
                    Release Year
                </label>
            </div>
        </div>

        <!-- Genre Selection -->
        <div class="form-field">
            <label class="block text-sm font-medium text-gray-700 mb-3">Genre</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="genre-option cursor-pointer">
                    <input type="radio" name="genre" value="Action" {{ 'checked' if game.genre == 'Action' }} class="sr-only peer" />
                    <div class="px-4 py-3 border border-gray-200 rounded-xl text-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 hover:border-blue-300 transition-all">
                        Action
                    </div>
                </label>
                <label class="genre-option cursor-pointer">
                    <input type="radio" name="genre" value="Adventure" {{ 'checked' if game.genre == 'Adventure' }} class="sr-only peer" />
                    <div class="px-4 py-3 border border-gray-200 rounded-xl text-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 hover:border-blue-300 transition-all">
                        Adventure
                    </div>
                </label>
                <label class="genre-option cursor-pointer">
                    <input type="radio" name="genre" value="RPG" {{ 'checked' if game.genre == 'RPG' }} class="sr-only peer" />
                    <div class="px-4 py-3 border border-gray-200 rounded-xl text-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 hover:border-blue-300 transition-all">
                        RPG
                    </div>
                </label>
                <label class="genre-option cursor-pointer">
                    <input type="radio" name="genre" value="Shooter" {{ 'checked' if game.genre == 'Shooter' }} class="sr-only peer" />
                    <div class="px-4 py-3 border border-gray-200 rounded-xl text-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 hover:border-blue-300 transition-all">
                        Shooter
                    </div>
                </label>
                <label class="genre-option cursor-pointer">
                    <input type="radio" name="genre" value="Sports" {{ 'checked' if game.genre == 'Sports' }} class="sr-only peer" />
                    <div class="px-4 py-3 border border-gray-200 rounded-xl text-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 hover:border-blue-300 transition-all">
                        Sports
                    </div>
                </label>
                <label class="genre-option cursor-pointer">
                    <input type="radio" name="genre" value="Puzzle" class="sr-only peer" />
                    <div class="px-4 py-3 border border-gray-200 rounded-xl text-center peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 hover:border-blue-300 transition-all">
                        Puzzle
                    </div>
                </label>
            </div>
        </div>

        <!-- Description -->
        <div class="form-field">
            <div class="relative">
                <textarea 
                    name="description" 
                    rows="4"
                    class="form-input w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-0 peer bg-gray-50/50 resize-none"
                    placeholder=" "
                    id="description"
                >{{ game.description }}</textarea>
                <label for="description" class="absolute left-4 top-3 text-gray-500 transition-all duration-200 peer-focus:text-xs peer-focus:-top-2 peer-focus:left-3 peer-focus:bg-white peer-focus:px-2 peer-focus:text-blue-600 peer-[:not(:placeholder-shown)]:text-xs peer-[:not(:placeholder-shown)]:-top-2 peer-[:not(:placeholder-shown)]:left-3 peer-[:not(:placeholder-shown)]:bg-white peer-[:not(:placeholder-shown)]:px-2">
                    Description
                </label>
            </div>
            <div class="flex justify-between mt-2">
                <span class="text-xs text-gray-400">Describe your game in detail</span>
                <span id="char-count" class="text-xs text-gray-400">95 characters</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4 pt-6">
            <button type="button" class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all duration-200 font-medium">
                Cancel
            </button>
            <button type="submit" class="save-button flex-1 px-6 py-3 text-white rounded-xl font-medium flex items-center justify-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <span>Save Changes</span>
            </button>
        </div>
    </form>

    <script>
        // Star rating functionality
        function createStarRating() {
            const starContainer = document.getElementById('star-rating');
            const ratingValue = document.getElementById('rating-value');
            const ratingInput = document.getElementById('rating-input');
            const slider = document.getElementById('rating-slider');
            
            function updateStars(rating) {
                starContainer.innerHTML = '';
                for (let i = 1; i <= 10; i++) {
                    const star = document.createElement('div');
                    star.className = 'rating-star w-6 h-6';
                    star.innerHTML = `<svg class="w-full h-full ${rating >= i ? 'text-yellow-400' : 'text-gray-300'}" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
                    </svg>`;
                    star.addEventListener('click', () => {
                        const newRating = i;
                        slider.value = newRating;
                        ratingInput.value = newRating;
                        ratingValue.textContent = newRating.toFixed(1);
                        updateStars(newRating);
                    });
                    starContainer.appendChild(star);
                }
            }
            
            slider.addEventListener('input', (e) => {
                const rating = parseFloat(e.target.value);
                ratingInput.value = rating;
                ratingValue.textContent = rating.toFixed(1);
                updateStars(rating);
            });
            
            updateStars(parseFloat(slider.value));
        }

        // Character count for description
        function setupCharCount() {
            const textarea = document.getElementById('description');
            const charCount = document.getElementById('char-count');
            
            function updateCount() {
                const count = textarea.value.length;
                charCount.textContent = `${count} characters`;
            }
            
            textarea.addEventListener('input', updateCount);
            updateCount();
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            createStarRating();
            setupCharCount();
        });
    </script>
</body>
</html>
