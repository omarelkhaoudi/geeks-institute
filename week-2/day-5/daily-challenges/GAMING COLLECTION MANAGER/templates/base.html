<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <!-- navbar -->
    <nav class="bg-gray-700 py-2 max-xl:px-3">
      <div class="max-w-7xl mx-auto flex justify-between items-center gap-4">
        <!-- Logo -->
        <div class="flex items-center gap-2">
          <i class="bi bi-controller text-white text-2xl"></i>
          <a href="/" class="text-white text-2xl font-bold">Game App</a>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-md mx-4">
          <form action="/search" method="GET" class="relative">
            <input
              type="text"
              name="q"
              placeholder="Search games..."
              class="w-full px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
            />
            <button
              type="submit"
              class="absolute right-1 top-1 bottom-1 px-3 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition"
            >
              <i class="bi bi-search"></i>
            </button>
          </form>
        </div>

        <!-- New Game Button -->
        <a
          href="/create"
          class="bg-gray-50 text-gray-700 px-4 py-2 rounded-md flex items-center gap-2 hover:bg-gray-200 transition"
        >
          <i class="bi bi-plus-lg"></i>
          <span class="font-semibold">New Game</span>
        </a>
      </div>
    </nav>

    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="max-w-7xl mx-auto my-4">
      {% for category, message in messages %}
      <div
        class="bg-{{ category }}-100 flex items-center gap-2 justify-between border border-{{ category }}-400 text-{{ category }}-700 px-4 py-3 rounded relative"
        role="alert"
      >
        <span class="block sm:inline">{{ message }}</span>
        <i
          class="bi bi-x-lg cursor-pointer"
          onclick="this.parentElement.remove()"
        ></i>
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %} {% endblock %}
  </body>
</html>
