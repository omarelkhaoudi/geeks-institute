{% extends "base.html" %}
{% block content %}
  <!-- Content -->
  <main class="max-w-7xl mx-auto px-6 py-10">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Our Game Developers</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      {% for dev in developers %}
      <div class="bg-white rounded-2xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1 overflow-hidden">
        
        <!-- Logo -->
        <div class="bg-gray-100 h-48 flex items-center justify-center">
          {% if dev.logo_url %}
        <img src="{{ dev.logo_url }}" 
         alt="{{ dev.name }} logo" 
         class="w-full h-full object-contain p-6">
          {% else %}
        <span class="text-gray-400 text-4xl font-bold">{{ dev.name[0] }}</span>
          {% endif %}
    </div>

        <!-- Card Body -->
        <div class="p-5">
          <h3 class="text-xl font-bold text-gray-800 mb-1">{{ dev.name }}</h3>
          <p class="text-gray-500 mb-4">{{ dev.country or "Unknown Country" }}</p>

          <a href="#" 
             class="inline-block w-full text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">
            View Games
          </a>
        </div>
      </div>
      {% endfor %}
    </div>
  </main>
{% endblock %}
