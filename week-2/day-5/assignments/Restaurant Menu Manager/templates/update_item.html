<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Menu Item</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Update Item</h1>

    <form method="POST" class="space-y-4">
      <!-- Name -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Name</label>
        <input 
          type="text" 
          name="name" 
          value="{{ item[0] }}" 
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        >
      </div>

      <!-- Price -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Price</label>
        <input 
          type="number" 
          name="price" 
          value="{{ item[1] }}" 
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        >
      </div>

      <!-- Submit -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 text-white py-2 rounded-lg shadow-md hover:bg-blue-700 transition"
      >
        Update Item
      </button>
    </form>

    <!-- Back Link -->
    <div class="mt-6 text-center">
      <a href="{{ url_for('menu') }}" class="text-blue-600 hover:underline">
        ← Back to Menu
      </a>
    </div>
  </div>

</body>
</html>
