<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Restaurant Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-8">

  <h1 class="text-3xl font-bold mb-6 text-gray-800">🍽️ Restaurant Menu</h1>

  <a href="{{ url_for('add_item') }}" 
     class="mb-6 inline-block bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow">
     ➕ Add New Item
  </a>

  <div class="overflow-x-auto w-full max-w-3xl">
    <table class="w-full border-collapse bg-white rounded-lg shadow-lg">
      <thead class="bg-gray-200 text-gray-700">
        <tr>
          <th class="py-3 px-4 text-left">Name</th>
          <th class="py-3 px-4 text-left">Price</th>
          <th class="py-3 px-4 text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for item in items %}
        <tr class="border-b hover:bg-gray-50">
          <td class="py-3 px-4 font-medium text-gray-800">{{ item[0] }}</td>
          <td class="py-3 px-4 text-gray-600">{{ item[1] }} MAD</td>
          <td class="py-3 px-4 text-center space-x-2">
            <a href="{{ url_for('update_item', name=item[0]) }}" 
               class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg shadow">
               ✏️ Update
            </a>
            <a href="{{ url_for('delete_item', name=item[0]) }}" 
               class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg shadow">
               🗑️ Delete
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</body>
</html>
