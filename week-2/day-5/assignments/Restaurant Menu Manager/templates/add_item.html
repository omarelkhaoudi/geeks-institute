<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Menu Item</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">➕ Add New Menu Item</h1>

    <form method="POST" class="space-y-5">
      <!-- Item Name -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">Name</label>
        <input type="text" name="name" required
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <!-- Item Price -->
      <div>
        <label class="block text-gray-700 font-medium mb-2">Price (MAD)</label>
        <input type="number" name="price" step="0.01" required
               class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
      </div>

      <!-- Submit Button -->
      <button type="submit"
              class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg shadow">
        ✅ Add Item
      </button>
    </form>

    <!-- Back Link -->
    <div class="mt-6 text-center">
      <a href="{{ url_for('menu') }}"
         class="text-blue-500 hover:text-blue-700 font-medium">
        ⬅️ Back to Menu
      </a>
    </div>
  </div>

</body>
</html>
