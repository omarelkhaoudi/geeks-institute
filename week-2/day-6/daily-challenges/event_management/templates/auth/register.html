{% extends 'base.html' %}
{% block content %}
<div class="flex justify-center py-12">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-gray-200 p-8">
    <h1 class="text-3xl font-extrabold text-green-600 mb-6 text-center">Create an Account</h1>

    <form method="POST" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input 
          id="username" 
          name="username" 
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition"
          required
        >
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input 
          id="email" 
          type="email" 
          name="email" 
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition"
          required
        >
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          id="password" 
          type="password" 
          name="password" 
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 focus:border-green-500 transition"
          required
        >
      </div>

      <button class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition">
        Create Account
      </button>
    </form>

    <p class="mt-5 text-sm text-gray-600 text-center">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" class="text-green-600 hover:text-green-700 font-medium">Login</a>
    </p>
  </div>
</div>
{% endblock %}
