<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .container {
      background: #3498db;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
      font-size: 28px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      margin: 0 auto;
    }

    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      color: white;
      border: 3px solid black;
      cursor: pointer;
    }

    .cell:nth-child(-n+3) { border-top: none; }
    .cell:nth-child(3n+1) { border-left: none; }
    .cell:nth-child(3n) { border-right: none; }
    .cell:nth-last-child(-n+3) { border-bottom: none; }

    .controls {
      margin-top: 15px;
    }

    button {
      margin: 5px;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ddd;
    }

    .message {
      color: white;
      font-size: 20px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe Game</h1>

    <div class="controls">
      <button onclick="chooseSymbol('X')">Play as X</button>
      <button onclick="chooseSymbol('O')">Play as O</button>
      <button onclick="setLevel('easy')">Easy</button>
      <button onclick="setLevel('hard')">Hard</button>
    </div>

    <div class="board" id="board"></div>

    <div class="message" id="message"></div>

    <button onclick="restartGame()">Restart Game</button>
  </div>

  <script>
    const boardElement = document.getElementById("board");
    const messageElement = document.getElementById("message");
    let board = Array(9).fill(null);
    let player = "X";
    let computer = "O";
    let level = "easy";
    let gameOver = false;

    const winCombos = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function renderBoard() {
      boardElement.innerHTML = "";
      board.forEach((cell, i) => {
        const div = document.createElement("div");
        div.classList.add("cell");
        div.textContent = cell || "";
        div.onclick = () => makeMove(i);
        boardElement.appendChild(div);
      });
    }

    function chooseSymbol(symbol) {
      player = symbol;
      computer = symbol === "X" ? "O" : "X";
      restartGame();
    }

    function setLevel(lvl) {
      level = lvl;
      messageElement.textContent = "Level set to " + lvl;
    }

    function makeMove(i) {
      if (board[i] || gameOver) return;
      board[i] = player;
      if (checkWinner(player)) {
        messageElement.textContent = "You win!";
        gameOver = true;
        renderBoard();
        return;
      }
      if (board.every(cell => cell)) {
        messageElement.textContent = "Tie game!";
        gameOver = true;
        renderBoard();
        return;
      }
      computerMove();
    }

    function computerMove() {
      let move;
      if (level === "easy") {
        const emptyCells = board.map((v,i) => v ? null : i).filter(v => v !== null);
        move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      } else {
        move = bestMove();
      }
      board[move] = computer;
      if (checkWinner(computer)) {
        messageElement.textContent = "Computer wins!";
        gameOver = true;
      } else if (board.every(cell => cell)) {
        messageElement.textContent = "Tie game!";
        gameOver = true;
      }
      renderBoard();
    }

    function bestMove() {
      // 1. Gagner si possible
      for (let combo of winCombos) {
        const [a,b,c] = combo;
        if (board[a] === computer && board[b] === computer && !board[c]) return c;
        if (board[a] === computer && board[c] === computer && !board[b]) return b;
        if (board[b] === computer && board[c] === computer && !board[a]) return a;
      }
      // 2. Bloquer le joueur
      for (let combo of winCombos) {
        const [a,b,c] = combo;
        if (board[a] === player && board[b] === player && !board[c]) return c;
        if (board[a] === player && board[c] === player && !board[b]) return b;
        if (board[b] === player && board[c] === player && !board[a]) return a;
      }
      // 3. Sinon coup random
      const emptyCells = board.map((v,i) => v ? null : i).filter(v => v !== null);
      return emptyCells[Math.floor(Math.random() * emptyCells.length)];
    }

    function checkWinner(symbol) {
      return winCombos.some(combo => combo.every(i => board[i] === symbol));
    }

    function restartGame() {
      board = Array(9).fill(null);
      gameOver = false;
      messageElement.textContent = "";
      renderBoard();
    }

    renderBoard();
  </script>
</body>
</html>
