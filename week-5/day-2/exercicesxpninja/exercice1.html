<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giphy Search</title>
  <style>
    #gif-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }
    img {
      width: 180px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Search Giphy</h1>
  
  <form id="gifForm">
    <input type="text" id="searchInput" placeholder="Enter a category" required>
    <button type="submit">Find</button>
  </form>
  
  <button id="deleteBtn">Delete</button>
  
  <div id="gif-container"></div>

  <script>
    const API_KEY = "hpvZycW22qCjn5cRM1xtWB8NKq4dQ2My"; // replace with your Giphy API key
    const gifForm = document.getElementById("gifForm");
    const searchInput = document.getElementById("searchInput");
    const gifContainer = document.getElementById("gif-container");
    const deleteBtn = document.getElementById("deleteBtn");

    // Fetch GIFs on form submit
    gifForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      gifContainer.innerHTML = ""; // clear old results

      const searchTerm = searchInput.value.trim();
      if (!searchTerm) return;

      try {
        const response = await fetch(
          `https://api.giphy.com/v1/gifs/search?api_key=${API_KEY}&q=${searchTerm}&limit=20`
        );

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();

        data.data.forEach(gif => {
          const img = document.createElement("img");
          img.src = gif.images.fixed_height.url;
          gifContainer.appendChild(img);
        });

      } catch (error) {
        console.error("Error fetching GIFs:", error);
      }
    });

    // Delete button clears all GIFs
    deleteBtn.addEventListener("click", () => {
      gifContainer.innerHTML = "";
    });
  </script>
</body>
</html>
