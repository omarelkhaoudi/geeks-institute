<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Giphy Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    #gif-container {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .gif-card {
      position: relative;
      display: inline-block;
    }
    .gif-card img {
      max-width: 250px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .gif-card button {
      margin-top: 5px;
      background: crimson;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .gif-card button:hover {
      background: darkred;
    }
    #delete-all {
      margin-top: 15px;
      background: black;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    #delete-all:hover {
      background: gray;
    }
  </style>
</head>
<body>
  <h1>🎬 Giphy Random Search</h1>
  <form id="gif-form">
    <input type="text" id="search" placeholder="Enter category (e.g. sun)" required>
    <button type="submit">Search Gif</button>
  </form>
  <button id="delete-all">DELETE ALL</button>
  <div id="gif-container"></div>

  <script src="script.js"></script>
</body>
</html>
