<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giphy API Exercise</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    img {
      max-width: 300px;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    button {
      margin-top: 15px;
      padding: 8px 12px;
      background: teal;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: darkslategray;
    }
  </style>
</head>
<body>
  <h1>🎬 Random Giphy</h1>
  <button id="get-gif">Get Random GIF</button>
  <div id="gif-container"></div>

  <script src="script.js"></script>
</body>
</html>
